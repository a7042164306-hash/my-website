<!DOCTYPE html>
<html>
<head>
<title>Instagram Login</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#fafafa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.login-box{
    width:350px;
    background:white;
    border:1px solid #dbdbdb;
    padding:40px;
    text-align:center;
}
.logo{
    font-size:40px;
    font-family:cursive;
    margin-bottom:30px;
}
input{
    width:90%;
    padding:10px;
    margin:5px 0;
    border:1px solid #dbdbdb;
    border-radius:4px;
}
button{
    width:96%;
    padding:10px;
    background:#0095f6;
    color:white;
    border:none;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
}
p{
    color:#737373;
    font-size:14px;
}
a{
    text-decoration:none;
    color:#0095f6;
}
</style>
</head>
<body>

<div class="login-box">
    <div class="logo">Instagram</div>

    <input type="text" placeholder="Phone number, username, or email">
    <input type="password" placeholder="Password">

    <button>Log In</button>

    <p><a href="#">Forgot password?</a></p>
    <hr>
    <p>Don't have an account? <a href="#">Sign up</a></p>
</div>

</body>
</html>
